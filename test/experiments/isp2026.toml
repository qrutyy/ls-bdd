# The experiment of the ISP RAS 2026 paper (lock-free skip list against
# lock-free hash table), written in the experiment language: the IOPS part,
# figs. 3-5 of the paper. The latency part is isp2026_lat.toml.
#
# This is an equivalent description: the results in the paper were obtained
# with the shell system of this version (test/main.sh, test/plots.sh), run
# with the parameters of table 1 of the paper, which are the ones below:
#   - bs 8k; read/write mixes 0/100, 65/35, 100/0
#   - 25 runs of 180 s, after a 60 s warm-up (fio ramp_time)
#   - numjobs 1..32 with iodepth = 4 * numjobs (figs. 3-4)
#
# Known differences from the shell system:
#   - writing runs are bounded by bytes as well as by runtime (see
#     runner.plan_io), so they cannot run past the end of the backing device;
#   - preconditioning is one sequential pass with 128k blocks, where the shell
#     system ran 10 jobs of 8k blocks over the same region.
#
# Build the lock-free module first: make -C ../src type=lf
#
# 72 points x 25 repeats = 1800 runs of 240 s, about 120 hours.
name = "isp2026"

[device]
# The NVMe drive of the paper's platform: its contents are lost.
backing = "/dev/nvme1n1"

[matrix]
ds = ["sl", "ht"]
# rw/randrw with the read share of table 1: 0/100, 65/35, 100/0
rw = ["rw:0", "rw:65", "rw:100", "randrw:0", "randrw:65", "randrw:100"]
bs = ["8k"]
# [numjobs, iodepth]
concurrency = [[1, 4], [2, 8], [4, 16], [8, 32], [16, 64], [32, 128]]

[fio]
ioengine = "io_uring"
runtime = 180

[fio.extra]
ramp_time = 60
registerfiles = 1
fixedbufs = 1
hipri = 0
prio = 0
norandommap = 0
cpus_allowed_policy = "shared"
cpus_allowed = "0-{last_cpu}"
offset = "16k"

[run]
repeats = 25
baseline = false
precondition = "auto"
region = 0.1

[tags]
mode = "lf"
paper = "ISP RAS 2026"
