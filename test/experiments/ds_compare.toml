# Mapping indexes against each other and against the bare backing device,
# over the access patterns and the concurrency that matter for an LS device.
# The lf/sy mode is chosen at build time (make TY=...), hence the tag:
# run once per build and pass both result directories to `report`.
#
# 900 runs of up to 30 s each, about 8 hours with preconditioning.
name = "ds_compare"

[device]
backing = "brd"
backing_size_gib = 8
cell_size = 4096

[matrix]
ds = ["ht", "sl", "bt", "rb"]
rw = ["randwrite", "randread", "randrw:70"]
bs = ["4k", "16k"]
numjobs = [1, 4, 8]
iodepth = [1, 32]

[fio]
ioengine = "io_uring"
runtime = 30
extra = { cpus_allowed_policy = "shared" }

[run]
repeats = 5
baseline = true
precondition = "auto"
region = 0.25

[tags]
mode = "lf"
