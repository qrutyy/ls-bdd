name: Kernel module build

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # The only place the target kernel version is spelled out.
      KERNEL_VERSION: 7.2.9

    steps:
      - name: Display Runner's System Info (for context)
        run: |
          echo "Runner's kernel version:"
          uname -a
          uname -r
          echo "Targeting build for: Linux $KERNEL_VERSION (generic)"

      - name: Derive kernel source paths
        run: |
          # cdn.kernel.org groups releases by major series: 7.2.9 -> v7.x
          echo "KERNEL_SERIES=v${KERNEL_VERSION%%.*}.x" >> "$GITHUB_ENV"
          echo "KERNEL_SOURCE_PATH=$HOME/kernel/linux-$KERNEL_VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev libdw-dev dwarves bc rsync cpio kmod zstd

      - name: Download and prepare kernel sources
        run: |
          mkdir -p "$HOME/kernel"
          cd "$HOME/kernel"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/$KERNEL_SERIES/linux-$KERNEL_VERSION.tar.xz"
          tar -xf "linux-$KERNEL_VERSION.tar.xz"
          cd "$KERNEL_SOURCE_PATH"
          # Start from the in-tree defconfig, never from the runner's own
          # /boot/config-*: with no .config present Kconfig silently falls back
          # to the host kernel's config, which drags an Ubuntu 6.17 config into
          # a 7.2.9 tree (invalid-symbol warnings and unrelated build tooling).
          make defconfig
          # BTF generation ties the build to the exact pahole version the kernel
          # was configured with; modversions pulls in gendwarfksyms; module
          # signing needs keys we do not use - none of it matters for a compile
          # check of an out-of-tree module. CONFIGFS_FS and BLOCK, on the other
          # hand, are what the module itself is written against.
          ./scripts/config --file .config \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO_BTF_MODULES \
            --disable MODULE_SIG \
            --disable MODVERSIONS \
            --enable MODULES \
            --enable BLOCK \
            --enable BLK_DEV \
            --enable CONFIGFS_FS
          make olddefconfig
          make prepare
          make modules_prepare

      - name: Build module
        env:
          KBUILD_MODPOST_WARN: "1"
        run: |
          echo "Kernel source for build: $KERNEL_SOURCE_PATH"
          cd src/
          make type=lf KERNELDIR="$KERNEL_SOURCE_PATH"

      - name: List built artifacts (optional)
        if: always()
        run: |
          echo "Listing contents of src/ after build:"
          ls -l src/
          echo "Looking for .ko files:"
          find src/ -name "*.ko"
